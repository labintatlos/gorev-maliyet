name: "Görev Maliyet Hesaplayıcı"
description: "Görev süresi ve maliyet hesabı — kullanıcı adı ve şifreyle açılan web sitesi"
version: "4.1.0"
slug: "gorev_maliyet"
url: "https://github.com/labintatlos/gorev-maliyet"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: false

# Ayni site Home Assistant yan menusunde de acilir; orada kimlik HA oturumundan
# gelir. Ingress portu disariya acilmaz.
ingress: true
ingress_port: 8099
panel_icon: mdi:calculator-variant
panel_title: Görev Maliyet

# 8102 kullanici adi/sifreyle acilan web sitesidir ve Ingress basliklarina hic
# guvenmez. Internete dogrudan duz HTTP olarak degil, KeenDNS gibi HTTPS veren
# bir yolla acilmalidir.
ports:
  8102/tcp: 8102
ports_description:
  8102/tcp: Web sitesi (kullanıcı adı ve şifre). İnternete KeenDNS gibi HTTPS veren bir yolla açın.

# Veritabani /share/gorev_maliyet altinda durur; guncellemede silinmez.
map:
  - share:rw

options:
  timezone: "Europe/Istanbul"

schema:
  timezone: str
